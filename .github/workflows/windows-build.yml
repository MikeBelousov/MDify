name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
      - "workers/**"
      - ".github/workflows/windows-build.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "APP_VERSION=0.1.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            workers/lite/requirements-lite.txt
            workers/ocr/requirements-ocr.txt

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache OCR models
        uses: actions/cache@v5
        with:
          path: workers/ocr/models
          key: ocr-models-${{ hashFiles('workers/ocr/model_manifest.json') }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Test Windows OCR solution
        run: dotnet test windows/MDify.Windows.sln -c Release -p:MDifyVariant=Ocr

      - name: Test Windows Lite solution
        run: dotnet test windows/MDify.Windows.sln -c Release -p:MDifyVariant=Lite

      - name: Install worker test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r workers/ocr/requirements-ocr.txt
          python -m pip install pytest

      - name: Download OCR models
        shell: pwsh
        run: python workers/build/download_models.py

      - name: Test Python workers
        shell: pwsh
        run: |
          python -m pytest workers/tests/test_lite_worker.py -q
          python -m pytest workers/tests/test_ocr_worker.py -q
          python -m pytest workers/tests/test_ocr_benchmark.py -q
          python -m pytest workers/tests/test_windows_worker_build_script.py -q
          python -m pytest windows/tests/test_installer_contract.py windows/tests/test_windows_variant_contract.py -q

      - name: Build lite worker
        shell: pwsh
        run: ./workers/build/build_worker_windows.ps1 -Variant lite -Python python

      - name: Build OCR worker
        shell: pwsh
        run: ./workers/build/build_worker_windows.ps1 -Variant ocr -Python python

      - name: Verify OCR worker model contract
        shell: pwsh
        run: |
          $worker = ".build/workers/win-x64/mdify-worker-ocr"
          $bundledManifest = @(Get-ChildItem $worker -Recurse -File -Filter "model_manifest.json")
          if ($bundledManifest.Count -ne 1) {
            throw "Expected exactly one OCR model manifest in Windows worker"
          }

          $manifest = Get-Content workers/ocr/model_manifest.json -Raw | ConvertFrom-Json
          $manifestModels = @($manifest.files | ForEach-Object { $_.path.Replace("\", "/") } | Sort-Object)
          $modelsRoot = Join-Path $bundledManifest[0].DirectoryName "models"
          $bundledModels = @(Get-ChildItem $modelsRoot -Recurse -File | ForEach-Object {
            [IO.Path]::GetRelativePath($modelsRoot, $_.FullName).Replace("\", "/")
          } | Sort-Object)
          $modelDifference = @(Compare-Object $manifestModels $bundledModels)
          if ($modelDifference) {
            throw "Unexpected OCR models found in Windows worker: $($modelDifference.InputObject -join ', ')"
          }

          $forbiddenPpocrv6 = @(Get-ChildItem $worker -Recurse -File | Where-Object {
            $_.Name -match "PP-OCRv6"
          })
          if ($forbiddenPpocrv6) {
            throw "PP-OCRv6 must not be included in Windows worker: $($forbiddenPpocrv6.FullName -join ', ')"
          }

      - name: Publish Windows Lite app
        shell: pwsh
        run: dotnet publish windows/MDify.Windows/MDify.Windows.csproj -c Release -r win-x64 --self-contained true -p:MDifyVariant=Lite -o dist/windows/lite/app

      - name: Publish Windows OCR app
        shell: pwsh
        run: dotnet publish windows/MDify.Windows/MDify.Windows.csproj -c Release -r win-x64 --self-contained true -p:MDifyVariant=Ocr -o dist/windows/ocr/app

      - name: Copy variant workers and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows/lite/app/Workers | Out-Null
          New-Item -ItemType Directory -Force -Path dist/windows/ocr/app/Workers | Out-Null
          Copy-Item -Recurse -Force .build/workers/win-x64/mdify-worker-lite dist/windows/lite/app/Workers/
          Copy-Item -Recurse -Force .build/workers/win-x64/mdify-worker-ocr dist/windows/ocr/app/Workers/
          Copy-Item -Force LICENSE dist/windows/lite/app/
          Copy-Item -Force ThirdPartyNotices.md dist/windows/lite/app/
          Copy-Item -Force LICENSE dist/windows/ocr/app/
          Copy-Item -Force ThirdPartyNotices.md dist/windows/ocr/app/

      - name: Verify variant publish contents
        shell: pwsh
        run: |
          $lite = "dist/windows/lite/app"
          $ocr = "dist/windows/ocr/app"

          if (-not (Test-Path "$lite/Workers/mdify-worker-lite")) {
            throw "Expected Lite worker missing from Lite publish"
          }
          if (Test-Path "$lite/Workers/mdify-worker-ocr") {
            throw "Unexpected OCR worker found in Lite publish"
          }
          $liteModels = Get-ChildItem $lite -Recurse -File | Where-Object {
            $_.FullName.Replace("\", "/") -match "/workers/ocr/models/" -or
            $_.Name -match "PP-OCR|PaddleOCR"
          }
          if ($liteModels) {
            throw "PaddleOCR models found in Lite publish: $($liteModels.FullName -join ', ')"
          }

          if (-not (Test-Path "$ocr/Workers/mdify-worker-ocr")) {
            throw "Expected OCR worker missing from OCR publish"
          }
          if (Test-Path "$ocr/Workers/mdify-worker-lite") {
            throw "Unexpected Lite worker found in OCR publish"
          }
          $ocrDeps = Get-ChildItem $ocr -Recurse -File -Filter "*.deps.json"
          if (-not $ocrDeps) {
            throw "Expected a deps.json file in OCR publish"
          }
          $windowsAppSdkReferences = Select-String -Path $ocrDeps.FullName -Pattern "Microsoft.WindowsAppSDK"
          if ($windowsAppSdkReferences) {
            throw "Microsoft.WindowsAppSDK reference found in OCR publish deps.json"
          }
          $forbiddenOcrAssemblies = Get-ChildItem $ocr -Recurse -File | Where-Object {
            $_.Name -like "Microsoft.Windows.AI*.dll" -or
            $_.Name -like "Microsoft.Graphics.Imaging*.dll"
          }
          if ($forbiddenOcrAssemblies) {
            throw "Windows AI or imaging assemblies found in OCR publish: $($forbiddenOcrAssemblies.FullName -join ', ')"
          }

      - name: Build Inno installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" windows/installer/MDify-Lite.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Lite Inno Setup build failed with exit code $LASTEXITCODE"
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" windows/installer/MDify-OCR.iss
          if ($LASTEXITCODE -ne 0) {
            throw "OCR Inno Setup build failed with exit code $LASTEXITCODE"
          }

      - name: Report release asset sizes
        shell: pwsh
        run: |
          "### Windows release sizes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Asset | Bytes |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| --- | ---: |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Get-Item `
            dist/windows/installer/MDify-Windows-Lite-Setup.exe, `
            dist/windows/installer/MDify-Windows-OCR-Setup.exe |
            ForEach-Object {
              "$($_.Name)=$($_.Length)"
              "| ``$($_.Name)`` | $($_.Length) |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }

      - name: Upload Lite installer
        uses: actions/upload-artifact@v7
        with:
          name: MDify-Windows-Lite-Setup
          path: dist/windows/installer/MDify-Windows-Lite-Setup.exe

      - name: Upload OCR installer
        uses: actions/upload-artifact@v7
        with:
          name: MDify-Windows-OCR-Setup
          path: dist/windows/installer/MDify-Windows-OCR-Setup.exe

      - name: Upload release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --latest --title "MDify $env:GITHUB_REF_NAME" --notes "Release assets are uploaded by CI."
          }
          gh release upload $env:GITHUB_REF_NAME `
            dist/windows/installer/MDify-Windows-Lite-Setup.exe `
            dist/windows/installer/MDify-Windows-OCR-Setup.exe `
            --clobber
